name: Prepare films
on:
  push:
    paths: ["films/**", "films.csv", "tools/prepare.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-films
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare films
        run: python3 tools/prepare.py
      - name: Save changes
        run: |
          git config user.name "films-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A films posters films.csv
          if git diff --cached --quiet; then echo "nothing to change"; exit 0; fi
          git commit -m "Prepare films: posters and table"
          git pull --rebase && git push
